<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оцените наше кафе — MADLEN</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--o:#7a8033;--os:#99a04a;--cr:#f7f8ed;--tx:#1a1a1a;--tm:#5a5a5a;--tl:#9a9a9a;--bd:#ececec;--er:#d9534f}
body{font-family:Inter,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(160deg,#99a04a,#7a8033 45%,#5c6124);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{position:relative;background:#fff;color:var(--tx);border-radius:26px;padding:34px 32px 30px;max-width:500px;width:100%;box-shadow:0 30px 80px rgba(60,65,20,.35)}
.lang{position:absolute;top:16px;right:16px;display:flex;gap:2px;background:#f4f4f4;border-radius:10px;padding:3px}
.lang button{font:700 11.5px inherit;font-family:inherit;padding:6px 10px;border:0;border-radius:8px;background:0;color:var(--tm);cursor:pointer}
.lang button.on{background:#fff;color:var(--o);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.hd{text-align:center;margin-bottom:22px}.logo{width:180px;max-width:70%;margin-bottom:14px}.fb{font:700 30px "Playfair Display",serif;color:var(--o);letter-spacing:3px;margin-bottom:14px}
h1{font:700 26px/1.2 "Playfair Display",serif;margin-bottom:6px}.hd p{font-size:14px;color:var(--tm)}
hr{border:0;height:1px;background:linear-gradient(90deg,transparent,var(--bd),transparent);margin:22px 0}
.sl{font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--tl);margin-bottom:12px;text-align:center}
select,input,textarea{width:100%;font-family:inherit;color:var(--tx);background:#fff;border:1.5px solid var(--bd);border-radius:14px;outline:0;transition:.25s}
select{padding:15px 18px;font-size:15px;font-weight:600;cursor:pointer}
select:hover,select:focus,input:focus,textarea:focus{border-color:var(--o);background:var(--cr)}
.ad{font-size:12.5px;color:var(--o);font-weight:600;text-align:center;margin:8px 0 22px;min-height:18px}
.blk{display:none}.blk.on{display:block}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0 10px}
.star{font-size:42px;line-height:1;cursor:pointer;color:#e6e6e6;background:0;border:0;padding:4px;transition:.18s}.star:hover{transform:scale(1.18)}.star.on{color:#f5b800}
.hint{text-align:center;font-size:13.5px;color:var(--tl);min-height:20px;margin-bottom:18px}.hint.f{color:var(--o);font-weight:600}
label{display:block;font-size:12.5px;font-weight:600;color:var(--tm);margin:0 0 8px 4px}label b{color:var(--er)}
input,textarea{padding:13px 16px;font-size:14.5px}textarea{min-height:90px;resize:vertical}
.fe{font-size:12px;color:var(--er);font-weight:600;padding-left:4px;min-height:16px;margin-bottom:6px}
input.err{border-color:var(--er);background:#fdf2f2}
.btn{width:100%;padding:16px;font:700 15.5px inherit;font-family:inherit;border:0;border-radius:14px;background:linear-gradient(135deg,var(--os),var(--o));color:#fff;cursor:pointer;box-shadow:0 8px 20px rgba(122,128,51,.35);margin-top:6px}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.st{text-align:center;font-size:14px;font-weight:600;margin-top:14px;min-height:22px}.st.s{color:var(--tm)}.st.ok{color:var(--o)}.st.e{color:var(--er)}
.note{text-align:center;font-size:12px;color:var(--tl);margin-top:18px}
@media(max-width:480px){.card{padding:28px 22px 24px}h1{font-size:22px}.star{font-size:38px}}
</style></head><body>
<div class="card">
<div class="lang" id="lang"><button data-l="kz">ҚАЗ</button><button data-l="ru" class="on">РУС</button><button data-l="en">ENG</button></div>
<div class="hd"><img class="logo" src="logo.png" alt="MADLEN" onerror="this.outerHTML='<div class=fb>MADLEN</div>'"><h1 data-i="title"></h1><p data-i="sub"></p></div>
<hr><p class="sl" data-i="choose"></p>
<select id="sel"></select><p class="ad" id="ad"></p>
<div class="blk" id="rb">
<p class="sl" data-i="your"></p>
<div class="stars" id="stars"><button class="star" data-v="1">★</button><button class="star" data-v="2">★</button><button class="star" data-v="3">★</button><button class="star" data-v="4">★</button><button class="star" data-v="5">★</button></div>
<p class="hint" id="hint"></p>
<div class="blk" id="cb">
<label for="nm"><span data-i="name"></span> <b>*</b></label><input id="nm" autocomplete="name"><p class="fe" id="ne"></p>
<label for="ph"><span data-i="phone"></span> <b>*</b></label><input id="ph" type="tel" autocomplete="tel"><p class="fe" id="pe"></p>
<label for="tx" data-i="what"></label><textarea id="tx"></textarea><div style="height:14px"></div>
</div>
<button class="btn" id="go" disabled data-i="send"></button><p class="st" id="st"></p>
</div>
<p class="note" data-i="note"></p>
</div>
<script>

const CFG={token:"8866135340:AAHVRF407LI0y5_AMEOr0QbZ4zYrAMSPcQI",chat:"-1004363461887"};

const L=[
["kaz","Казиева — Казиева, 12а/1 (малый Самал)","Kazieva — Kaziev St, 12a/1 (Maly Samal)","https://go.2gis.com/oM6Yz"],
["nur2","Нурсат аллея — Назарбекова, 2","Nursat Alley — Nazarbekov St, 2","https://go.2gis.com/5hLMg"],

["m16","16 мкр — 16-й микрорайон, 37","16th Microdistrict — 37","https://go.2gis.com/o8nmB"],
["m18","18 мкр — Рыскулова, 26","18th Microdistrict — Ryskulov St, 26","https://go.2gis.com/WT0K8"],
["plz","Плаза — Аль-Фараби, 3/1","Plaza — Al-Farabi Sq, 3/1","https://go.2gis.com/VxFmU"],

["bak","Бакыт — Нурсат, 172а","Bakyt — Nursat, 172a","https://go.2gis.com/W192v"],
["flo","Флора — мкр Астана, 114","Flora — Astana Microdistrict, 114",""],
["ken","Кен Баба — Тауке хана, 37/3","Ken Baba — Tauke Khan Ave, 37/3","https://go.2gis.com/WnTnv"],
["kol","Колос — Гагарина, 1а/1","Kolos — Gagarin St, 1a/1","https://go.2gis.com/PNbeL"],
["m3","М-3 — Толе би, 41","M-3 — Tole bi St, 41","https://go.2gis.com/2uSKU"],
["hyp","Гиперхаус — Дулати, 202","Hyper House — Dulati St, 202","https://go.2gis.com/6x0y8"],

["pal","Палуба — пр. Республики, 6а","Paluba — Respublika Ave, 6a","https://go.2gis.com/gHMwL"],

["yan","Янги Шахар — Тамерлановское шоссе, 28","Yangi Shahar — Tamerlan Highway, 28","https://go.2gis.com/g7ZYE"],

["cit","Сити Мол — Байдибек би, 362/7","City Mall — Baidibek bi Ave, 362/7","https://go.2gis.com/OVPrs"]];
const T={
ru:{title:"Оцените наше кафе",sub:"Выберите локацию и поставьте оценку",choose:"Выберите локацию",ph0:"— Выберите локацию —",your:"Ваша оценка",hint:"Нажмите на звезду",name:"Ваше имя",phone:"Ваш телефон",what:"Опишите, что не понравилось",send:"Отправить",sending:"Отправляем...",ok:"Спасибо! Ваша жалоба отправлена руководителю.",thanks:"Спасибо за высокую оценку! Ждём вас снова.",err:"Не удалось отправить. Попробуйте ещё раз.",note:"Спасибо, что помогаете нам стать лучше",n0:"Укажите ваше имя",n1:"Имя должно быть не короче 2 символов",p0:"Укажите ваш телефон",p1:"Проверьте формат телефона (минимум 10 цифр)",set:n=>`Вы поставили ${n} ${n==1?"звезду":n<5?"звезды":"звёзд"}`},
kz:{title:"Кафемізді бағалаңыз",sub:"Локацияны таңдап, баға қойыңыз",choose:"Локацияны таңдаңыз",ph0:"— Локацияны таңдаңыз —",your:"Сіздің бағаңыз",hint:"Жұлдызға басыңыз",name:"Атыңыз",phone:"Телефоныңыз",what:"Не ұнамағанын сипаттаңыз",send:"Жіберу",sending:"Жіберілуде...",ok:"Рақмет! Шағымыңыз басшыға жіберілді.",thanks:"Жоғары бағаңыз үшін рақмет! Қайта күтеміз.",err:"Жіберу мүмкін болмады. Қайта көріңіз.",note:"Бізді жақсартуға көмектескеніңізге рақмет",n0:"Атыңызды көрсетіңіз",n1:"Аты кемінде 2 таңбадан тұруы керек",p0:"Телефоныңызды көрсетіңіз",p1:"Телефон форматын тексеріңіз (кемінде 10 цифр)",set:n=>`Сіз ${n} жұлдыз қойдыңыз`},
en:{title:"Rate our café",sub:"Choose a location and leave your rating",choose:"Choose a location",ph0:"— Choose a location —",your:"Your rating",hint:"Tap a star",name:"Your name",phone:"Your phone",what:"Describe what went wrong",send:"Submit",sending:"Sending...",ok:"Thank you! Your complaint has been sent to the manager.",thanks:"Thank you for the high rating! See you again.",err:"Could not send. Please try again.",note:"Thank you for helping us improve",n0:"Please enter your name",n1:"Name must be at least 2 characters",p0:"Please enter your phone",p1:"Check the phone format (at least 10 digits)",set:n=>`You rated ${n} ${n==1?"star":"stars"}`}};
const $=id=>document.getElementById(id),stars=[...document.querySelectorAll(".star")];
let lang="ru",loc=null,rate=0,busy=false;
$("sel").innerHTML='<option value=""></option>'+L.map(l=>`<option value="${l[0]}">${l[1]}</option>`).join("");
const digits=s=>s.replace(/\D/g,""),getL=()=>L.find(l=>l[0]===loc),lbl=l=>lang=="en"?l[2]:l[1];
function fmt(d){if(d[0]=="8"&&d.length==11)d="7"+d.slice(1);if(d.length==10)d="7"+d;return d.length==11?`+${d[0]} ${d.slice(1,4)} ${d.slice(4,7)} ${d.slice(7,9)} ${d.slice(9)}`:d}
const vN=()=>{const v=$("nm").value.trim();return v.length>=2?"":T[lang][v?"n1":"n0"]};
const vP=()=>{const v=$("ph").value.trim();return digits(v).length>=10?"":T[lang][v?"p1":"p0"]};
function showE(inp,el,msg){$(el).textContent=msg;$(inp).classList.toggle("err",!!msg)}
function ready(){$("go").disabled=busy||!loc||!rate||(rate<=3&&!!(vN()||vP()))}
function apply(){const t=T[lang];document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t[e.dataset.i]);
$("sel").options[0].textContent=t.ph0;[...$("sel").options].slice(1).forEach((o,i)=>o.textContent=lbl(L[i]));if(loc)$("ad").textContent=lbl(getL());$("hint").textContent=rate?t.set(rate):t.hint;document.documentElement.lang=lang=="kz"?"kk":lang;
if($("ne").textContent)showE("nm","ne",vN());if($("pe").textContent)showE("ph","pe",vP())}
function paint(v){stars.forEach(s=>s.classList.toggle("on",+s.dataset.v<=v))}
document.querySelectorAll("#lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;document.querySelectorAll("#lang button").forEach(x=>x.classList.toggle("on",x==b));apply()});
$("sel").onchange=()=>{loc=$("sel").value||null;$("ad").textContent=loc?lbl(getL()):"";$("rb").classList.toggle("on",!!loc);$("st").textContent="";ready()};
stars.forEach(s=>{s.onclick=()=>{rate=+s.dataset.v;paint(rate);$("hint").textContent=T[lang].set(rate);$("hint").classList.add("f");
$("cb").classList.toggle("on",rate<=3);if(rate>3){$("nm").value=$("ph").value=$("tx").value="";showE("nm","ne","");showE("ph","pe","")}ready()};
s.onmouseenter=()=>paint(+s.dataset.v)});
$("stars").onmouseleave=()=>paint(rate);
$("nm").oninput=()=>{showE("nm","ne","");ready()};$("nm").onblur=()=>{if($("nm").value.trim()){showE("nm","ne",vN());ready()}};
$("ph").oninput=()=>{const d=digits($("ph").value);if(d.length>=10&&d.length<=11)$("ph").value=fmt(d);showE("ph","pe","");ready()};
$("ph").onblur=()=>{if($("ph").value.trim()){showE("ph","pe",vP());ready()}};
function msg(l,name,phone,text){const n=new Date(),p=v=>String(v).padStart(2,"0");
return "⭐️".repeat(rate)+`\nИсточник: Сайт\nАдрес: ${l[1]}\nАвтор: ${name}\nТелефон: ${phone}\nДата: ${p(n.getDate())}.${p(n.getMonth()+1)}.${n.getFullYear()} ${p(n.getHours())}:${p(n.getMinutes())}\n`+
`Отзыв: \n\n${text||"—"}`}
$("go").onclick=async()=>{if(!loc||!rate||busy)return;const t=T[lang],l=getL(),st=$("st");
if(rate>=4){if(l[3])window.open(l[3],"_blank","noopener,noreferrer");else{st.className="st ok";st.textContent=t.thanks}return}
const e1=vN(),e2=vP();showE("nm","ne",e1);showE("ph","pe",e2);if(e1||e2)return;
busy=true;ready();st.className="st s";st.textContent=t.sending;
try{if(!CFG.token||!CFG.chat)throw new Error("CFG not set");
const r=await fetch(`https://api.telegram.org/bot${CFG.token}/sendMessage`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:CFG.chat,text:msg(l,$("nm").value.trim(),fmt(digits($("ph").value)),$("tx").value.trim())})});
const d=await r.json();if(!d.ok)throw new Error(d.description);
st.className="st ok";st.textContent=t.ok;
setTimeout(()=>{$("sel").value="";loc=null;rate=0;paint(0);$("ad").textContent="";$("rb").classList.remove("on");$("cb").classList.remove("on");$("nm").value=$("ph").value=$("tx").value="";$("hint").classList.remove("f");st.textContent="";st.className="st";busy=false;apply();ready()},2500)
}catch(x){console.error(x);st.className="st e";st.textContent=t.err;busy=false;ready()}};
apply();
</script></body></html>
