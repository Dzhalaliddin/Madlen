<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оцените нашу кофейню</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --madlen-olive: #7a8033;
    --madlen-olive-soft: #99a04a;
    --madlen-cream: #f7f8ed;
    --text-dark: #1a1a1a;
    --text-mid: #5a5a5a;
    --text-light: #9a9a9a;
    --border: #ececec;
    --surface: #ffffff;
    --error: #d9534f;
    --error-bg: #fdf2f2;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #99a04a 0%, #7a8033 45%, #5c6124 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -25%;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(255,255,255,0.22) 0%, transparent 65%);
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    background: var(--surface);
    color: var(--text-dark);
    border-radius: 26px;
    padding: 34px 32px 30px;
    max-width: 500px;
    width: 100%;
    box-shadow:
      0 30px 80px rgba(60, 65, 20, 0.35),
      0 0 0 1px rgba(255,255,255,0.4);
    animation: cardIn .7s cubic-bezier(.16,1,.3,1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .lang-switch {
    position: absolute;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 2px;
    background: #f4f4f4;
    border-radius: 10px;
    padding: 3px;
    z-index: 2;
  }

  .lang-btn {
    font-family: inherit;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .3px;
    padding: 6px 10px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--text-mid);
    cursor: pointer;
    transition: all .2s;
  }

  .lang-btn:hover { color: var(--madlen-olive); }

  .lang-btn.active {
    background: #fff;
    color: var(--madlen-olive);
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }

  .header { text-align: center; margin-bottom: 22px; }

  .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
  }

  .logo-img {
    width: 180px;
    height: auto;
    display: block;
  }

  .header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--text-dark);
    margin-bottom: 6px;
  }

  .header p {
    font-size: 14px;
    color: var(--text-mid);
    line-height: 1.5;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 22px 0;
  }

  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--text-light);
    margin-bottom: 12px;
    text-align: center;
  }

  .select-wrap {
    position: relative;
    margin-bottom: 8px;
  }

  .select-wrap::after {
    content: '';
    position: absolute;
    right: 18px;
    top: 50%;
    transform: translateY(-50%) rotate(45deg);
    width: 8px;
    height: 8px;
    border-right: 2px solid var(--madlen-olive);
    border-bottom: 2px solid var(--madlen-olive);
    pointer-events: none;
    margin-top: -3px;
  }

  .location-select {
    width: 100%;
    padding: 15px 44px 15px 18px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-dark);
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    transition: all .25s;
  }

  .location-select:hover,
  .location-select:focus {
    border-color: var(--madlen-olive);
    background: var(--madlen-cream);
  }

  .location-address {
    font-size: 12.5px;
    color: var(--text-mid);
    font-weight: 500;
    text-align: center;
    margin-bottom: 22px;
    min-height: 18px;
    line-height: 1.4;
    transition: color .2s;
  }

  .location-address.active {
    color: var(--madlen-olive);
    font-weight: 600;
  }

  .rating-block {
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    pointer-events: none;
    transition: opacity .4s ease, max-height .5s ease;
  }

  .rating-block.enabled {
    opacity: 1;
    max-height: 1400px;
    pointer-events: auto;
  }

  .stars {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 6px 0 10px;
    user-select: none;
  }

  .star {
    font-size: 42px;
    line-height: 1;
    cursor: pointer;
    color: #e6e6e6;
    background: none;
    border: none;
    padding: 4px;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), color .2s;
  }

  .star:hover { transform: scale(1.18) translateY(-2px); }

  .star.active {
    color: #f5b800;
    filter: drop-shadow(0 4px 8px rgba(245,184,0,0.35));
  }

  .hint {
    text-align: center;
    font-size: 13.5px;
    color: var(--text-light);
    min-height: 20px;
    margin-bottom: 18px;
    transition: color .2s;
  }

  .hint.filled { color: var(--madlen-olive); font-weight: 600; }

  .complaint-block {
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    pointer-events: none;
    transition: opacity .35s ease, max-height .7s ease;
    margin-bottom: 0;
  }

  .complaint-block.enabled {
    opacity: 1;
    max-height: 1000px;
    pointer-events: auto;
    margin-bottom: 14px;
  }

  .field-label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-mid);
    margin-bottom: 8px;
    padding-left: 4px;
  }

  .field-label .required {
    color: var(--error);
    font-weight: 700;
    margin-left: 2px;
  }

  .field-input,
  .field-textarea {
    width: 100%;
    padding: 13px 16px;
    font-family: inherit;
    font-size: 14.5px;
    color: var(--text-dark);
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    outline: none;
    transition: all .25s;
    line-height: 1.45;
  }

  .field-input { margin-bottom: 4px; }

  .field-gap { margin-bottom: 14px; }

  .field-textarea {
    min-height: 90px;
    resize: vertical;
    margin-bottom: 0;
  }

  .field-input:focus,
  .field-textarea:focus {
    border-color: var(--madlen-olive);
    background: var(--madlen-cream);
  }

  .field-input.error,
  .field-textarea.error {
    border-color: var(--error);
    background: var(--error-bg);
  }

  .field-error {
    font-size: 12px;
    color: var(--error);
    font-weight: 600;
    padding-left: 4px;
    margin-bottom: 0;
    min-height: 0;
    line-height: 1.3;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity .2s, max-height .25s, margin .2s;
  }

  .field-error.visible {
    opacity: 1;
    max-height: 40px;
    margin-bottom: 12px;
  }

  .btn {
    width: 100%;
    padding: 16px;
    font-family: inherit;
    font-size: 15.5px;
    font-weight: 700;
    letter-spacing: .3px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--madlen-olive-soft), var(--madlen-olive));
    color: #fff;
    cursor: pointer;
    transition: all .25s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 8px 20px rgba(122,128,51,0.35);
  }

  .btn:not(:disabled):hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(122,128,51,0.5);
    background: linear-gradient(135deg, var(--madlen-olive), #5c6124);
  }

  .btn:disabled {
    opacity: .4;
    cursor: not-allowed;
    box-shadow: none;
  }

  .status {
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    margin-top: 14px;
    min-height: 22px;
    line-height: 1.4;
    transition: opacity .25s;
  }

  .status.sending { color: var(--text-mid); }
  .status.success { color: var(--madlen-olive); }
  .status.error   { color: var(--error); }

  .note {
    text-align: center;
    font-size: 12px;
    color: var(--text-light);
    margin-top: 18px;
    line-height: 1.55;
  }

  @media (max-width: 480px) {
    .card { padding: 28px 22px 24px; border-radius: 22px; }
    .header h1 { font-size: 22px; }
    .logo-img { width: 150px; }
    .star { font-size: 38px; }

    .lang-switch { top: 12px; right: 12px; }
    .lang-btn { padding: 5px 8px; font-size: 11px; }
  }
</style>

  /* === ОБНОВИТЬ ТЕКСТ ОПЦИЙ ЛОКАЦИЙ ===
     RU и KZ — русский текст
     EN — транслитерация
  */
  function refreshLocationOptions() {
    locationSelect.querySelectorAll("option[data-ru]").forEach(opt => {
      if (currentLang === "en") {
        opt.textContent = opt.dataset.en || opt.dataset.ru;
      } else {
        opt.textContent = opt.dataset.ru;
      }
    });
  }

  /* === ПОЛУЧИТЬ НАЗВАНИЕ ЛОКАЦИИ ДЛЯ ТЕКУЩЕГО ЯЗЫКА === */
  function getLocationName(key) {
    const opt = locationSelect.querySelector(`option[value="${key}"]`);
    if (!opt) return "";

    if (currentLang === "en") {
      return opt.dataset.en || opt.dataset.ru || "";
    }
    return opt.dataset.ru || "";
  }

  const langButtons = document.querySelectorAll(".lang-btn");
  langButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      currentLang = btn.dataset.lang;
      langButtons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      applyLanguage();
    });
  });

  function applyLanguage() {
    const t = TRANSLATIONS[currentLang];

    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.dataset.i18n;
      if (t[key]) el.textContent = t[key];
    });

    refreshLocationOptions();

    if (selectedLocation) {
      locationAddress.textContent = getLocationName(selectedLocation);
    }

    if (rating > 0) {
      hint.textContent = t.ratingSet(rating);
    } else {
      hint.textContent = t.hint;
    }

    document.documentElement.lang = currentLang === "kz" ? "kk" : currentLang;

    if (nameError.classList.contains("visible")) {
      nameError.textContent = nameInput.value.trim() ? t.nameErrorShort : t.nameErrorEmpty;
    }
    if (phoneError.classList.contains("visible")) {
      phoneError.textContent = phoneInput.value.trim() ? t.phoneErrorShort : t.phoneErrorEmpty;
    }
  }

  locationSelect.addEventListener("change", () => {
    const key = locationSelect.value;

    if (!key) {
      selectedLocation = null;
      locationAddress.textContent = "";
      locationAddress.classList.remove("active");
      ratingBlock.classList.remove("enabled");
      checkReady();
      return;
    }

    selectedLocation = key;
    locationAddress.textContent = getLocationName(key);
    locationAddress.classList.add("active");
    ratingBlock.classList.add("enabled");
    checkReady();
  });

  stars.forEach(star => {
    star.addEventListener("click", () => {
      rating = parseInt(star.dataset.value, 10);
      updateStars(rating);
      hint.textContent = TRANSLATIONS[currentLang].ratingSet(rating);
      hint.classList.add("filled");

      if (rating <= 3) {
        complaintBlock.classList.add("enabled");
      } else {
        complaintBlock.classList.remove("enabled");
        complaintText.value = "";
        nameInput.value = "";
        phoneInput.value = "";
        clearNameError();
        clearPhoneError();
      }

      checkReady();
    });
    star.addEventListener("mouseenter", () => updateStars(parseInt(star.dataset.value, 10)));
  });

  document.getElementById("stars").addEventListener("mouseleave", () => updateStars(rating));

  function updateStars(value) {
    stars.forEach(s => {
      s.classList.toggle("active", parseInt(s.dataset.value, 10) <= value);
    });
  }

  phoneInput.addEventListener("input", () => {
    const value = phoneInput.value;
    const digits = value.replace(/\D/g, "");

    if (digits.length >= 10 && digits.length <= 11) {
      phoneInput.value = formatKZPhone(digits);
    }

    if (phoneInput.classList.contains("error")) {
      clearPhoneError();
      checkReady();
    }
  });

  function formatKZPhone(digits) {
    let d = digits;
    if (d.startsWith("8") && d.length === 11) d = "7" + d.slice(1);
    if (d.length === 10) d = "7" + d;
    if (d.length !== 11) return digits;

    return `+${d[0]} ${d.slice(1, 4)} ${d.slice(4, 7)} ${d.slice(7, 9)} ${d.slice(9, 11)}`;
  }

  function validateName() {
    const t = TRANSLATIONS[currentLang];
    const value = nameInput.value.trim();

    if (!value) return { ok: false, msg: t.nameErrorEmpty };
    if (value.length < 2) return { ok: false, msg: t.nameErrorShort };
    return { ok: true };
  }

  function showNameError(msg) {
    nameError.textContent = msg;
    nameError.classList.add("visible");
    nameInput.classList.add("error");
  }

  function clearNameError() {
    nameError.textContent = "";
    nameError.classList.remove("visible");
    nameInput.classList.remove("error");
  }

  nameInput.addEventListener("input", () => {
    if (nameInput.classList.contains("error")) {
      clearNameError();
      checkReady();
    }
  });

  nameInput.addEventListener("blur", () => {
    if (rating > 0 && rating <= 3 && nameInput.value.trim()) {
      const v = validateName();
      if (!v.ok) showNameError(v.msg);
      else clearNameError();
      checkReady();
    }
  });

  function validatePhone() {
    const t = TRANSLATIONS[currentLang];
    const value = phoneInput.value.trim();

    if (!value) return { ok: false, msg: t.phoneErrorEmpty };

    const digits = value.replace(/\D/g, "");
    if (digits.length < 10) return { ok: false, msg: t.phoneErrorShort };

    return { ok: true };
  }

  function showPhoneError(msg) {
    phoneError.textContent = msg;
    phoneError.classList.add("visible");
    phoneInput.classList.add("error");
  }

  function clearPhoneError() {
    phoneError.textContent = "";
    phoneError.classList.remove("visible");
    phoneInput.classList.remove("error");
  }

  phoneInput.addEventListener("blur", () => {
    if (rating > 0 && rating <= 3 && phoneInput.value.trim()) {
      const v = validatePhone();
      if (!v.ok) showPhoneError(v.msg);
      else clearPhoneError();
      checkReady();
    }
  });

  function checkReady() {
    if (rating > 0 && rating <= 3) {
      const nv = validateName();
      const pv = validatePhone();
      submitBtn.disabled = isSending || !(selectedLocation && nv.ok && pv.ok);
    } else {
      submitBtn.disabled = isSending || !(selectedLocation && rating > 0);
    }
  }

  submitBtn.addEventListener("click", async () => {
    if (!selectedLocation || !rating || isSending) return;

    const t = TRANSLATIONS[currentLang];
    const locationName = getLocationName(selectedLocation);

    if (rating >= 4) {
      const link = LOCATION_LINKS[selectedLocation];
      window.open(link, "_blank", "noopener,noreferrer");
      return;
    }

    const nv = validateName();
    const pv = validatePhone();

    if (!nv.ok) { showNameError(nv.msg); }
    if (!pv.ok) { showPhoneError(pv.msg); }
    if (!nv.ok || !pv.ok) { checkReady(); return; }

    const name = nameInput.value.trim();
    const phone = formatKZPhone(phoneInput.value.replace(/\D/g, ""));

    isSending = true;
    checkReady();
    statusEl.className = "status sending";
    statusEl.textContent = t.sending;

    const message = buildTelegramMessage(
      locationName,
      rating,
      name,
      phone,
      complaintText.value.trim()
    );

    try {
      const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: message
        })
      });

      const data = await response.json();

      if (data.ok) {
        statusEl.className = "status success";
        statusEl.textContent = t.successComplaint;

        setTimeout(() => {
          locationSelect.value = "";
          locationAddress.textContent = "";
          locationAddress.classList.remove("active");
          ratingBlock.classList.remove("enabled");
          complaintBlock.classList.remove("enabled");
          complaintText.value = "";
          nameInput.value = "";
          phoneInput.value = "";
          clearNameError();
          clearPhoneError();
          selectedLocation = null;
          rating = 0;
          updateStars(0);
          hint.textContent = t.hint;
          hint.classList.remove("filled");
          statusEl.textContent = "";
          statusEl.className = "status";
          isSending = false;
          checkReady();
        }, 2500);
      } else {
        throw new Error(data.description || "Telegram API error");
      }
    } catch (err) {
      console.error(err);
      statusEl.className = "status error";
      statusEl.textContent = t.error;
      isSending = false;
      checkReady();
    }
  });

  applyLanguage();
</script>
